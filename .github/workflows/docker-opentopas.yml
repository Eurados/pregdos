name: Build OpenTOPAS base image
# Manual only, deliberately.  This image is the OpenTOPAS/Geant4 build: it is large, slow,
# and pinned to an OpenTOPAS version that changes far more rarely than PregDos does, so it
# has no business rebuilding on every PregDos release.  Publish a PregDos image with
# "Build and publish pregdos", which FROMs whatever this last pushed.
on:
  workflow_dispatch:
    inputs:
      run_heavy:
        description: "Run heavy image build/publish"
        type: boolean
        required: true
        default: false
      version:
        description: 'OpenTOPAS version to build'
        type: choice
        required: true
        default: '4.2.3'
        options:
          - '4.2.3'

jobs:
  build:
    if: inputs.run_heavy == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        opentopas_version: ${{ fromJson(format('["{0}"]', inputs.version)) }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Normalize image owner
        id: owner
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/opentopas/${{ matrix.opentopas_version }}/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner_lc }}/pregdos-base-opentopas-v${{ matrix.opentopas_version }}:latest
