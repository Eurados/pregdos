[build-system]
requires = ["setuptools>=42", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pregdos"
description = "PregDos: Pregnancy dosimetry recalculation tool for proton therapy under SONORA/PIANOFORTE."
authors = [
    { name = "Niels Bassler", email = "nbassler@users.noreply.github.com" },
]
license = { text = "MIT" }
readme = "README.md"
# 3.11 for stdlib tomllib, which pregdos/config.py reads the site config with.  CI has only
# ever tested 3.11, so the previous >=3.10 claim was unverified rather than supported.
requires-python = ">=3.11"
# Exactly what pregdos imports, and nothing else.  Transitive dependencies are the resolver's
# job: scipy and pandas arrive because dicomexport declares them, and werkzeug is here only
# because pregdos imports secure_filename itself rather than reaching through Flask.
dependencies = [
    "pydicom>=2.3.1",
    "numpy",
    "flask>=2.0.0",
    "werkzeug",
    "requests",
    "fpdf2>=2.8.7",
    # >=1.4.3: emits relative DicomDirectory/CloneRTDoseGridFrom (keeps studies relocatable,
    # pregdos #41), points DicomDirectory at the CT dir (nested-CT #52), sizes the World from
    # the CT + isocenter, and writes DicomOrigin so the patient is placed correctly.
    # >=1.5.0: names field outputs by DICOM BeamNumber and skips beams without BeamMeterset.
    # >=1.5.1: corrects two catalogued range shifter thicknesses -- CCB's RS_Block from
    # 39.936 to a centre-confirmed 36.5 mm, and WPE's RS51 from a guessed 51.0 to a stated
    # 44.4 mm -- so an older dicomexport computes a different range for those centres.  Also
    # adds an optional stated density per shifter (dicomexport #92).
    "dicomexport @ git+https://github.com/nbassler/dicomexport@v1.5.1",
]
dynamic = ["version"]

[project.optional-dependencies]
# web = ["streamlit>=1.12.0"]
dev = ["ruff>=0.15.7", "pytest>=7.2.1", "pytest-mock>=3.10.0", "pyright>=1.1.400"]

[project.scripts]
pregdos-web = "pregdos.webserver:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pregdos*"]

[tool.setuptools.package-data]
# "static/*" does not descend into subdirectories, so static/img needs its own glob.
pregdos = [
    "templates/*.html",
    "static/*",
    "static/img/*",
    "data/*.csv",
    "data/spr_tables/*",
    "data/beam_models/*",
    # Named explicitly: the "data/*.csv" glob above does not match it, and this is the one
    # copy of the annotated site config (packaging/ installs *this* file to /etc/pregdos/).
    "data/config.toml.example",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(message)s"

log_file = "pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_file_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 127

[tool.ruff.lint]
select = ["E", "F", "W"]

# Point the type checker at the project venv.  Both pyright and Pylance read this, so without
# it they resolve against whatever interpreter the editor happens to have selected and report
# every third-party import (flask, werkzeug, pydicom) as missing -- and then mis-resolve their
# signatures on top.
[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["pregdos", "tests"]

# The library is held to the full standard.  Tests are not, deliberately: they dereference an
# Optional straight after the call that produced it (`s = parse_plan_scaling(...); s.factor`),
# where a None fails the test anyway -- and does so with a clearer message than padding every
# assertion with `assert s is not None` would give.  They also read mock attributes such as
# `call_args`, which no stub declares.  Muting those rules here keeps `pregdos/` itself at zero
# type errors instead of drowning the real ones in test noise.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]   # tests import the package from the repo root, not from tests/
reportOptionalMemberAccess = "none"
reportOptionalOperand = "none"
reportOperatorIssue = "none"
reportGeneralTypeIssues = "none"
reportFunctionMemberAccess = "none"
reportArgumentType = "none"

[[tool.pyright.executionEnvironments]]
root = "pregdos"

[tool.yapf]
based_on_style = "pep8"
column_limit = 127

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
write_to = "pregdos/__version__.py"
