[build-system]
requires = ["setuptools>=42", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "pregdos"
description = "PregDos: Pregnancy dosimetry recalculation tool for proton therapy under SONORA/PIANOFORTE."
authors = [
    { name = "Niels Bassler", email = "nbassler@users.noreply.github.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydicom>=2.3.1",
    "numpy",
    "scipy",
    "flask>=2.0.0",
    "requests",
    "tqdm",
    "setuptools-scm",
    # >=1.4.3: emits relative DicomDirectory/CloneRTDoseGridFrom (keeps studies relocatable,
    # pregdos #41), points DicomDirectory at the CT dir (nested-CT #52), sizes the World from
    # the CT + isocenter, and writes DicomOrigin so the patient is placed correctly.
    "dicomexport @ git+https://github.com/nbassler/dicomexport@v1.4.3",
]
dynamic = ["version"]

[project.optional-dependencies]
# web = ["streamlit>=1.12.0"]
dev = ["ruff>=0.15.7", "pytest>=7.2.1", "pytest-mock>=3.10.0"]

[project.scripts]
pregdos-web = "pregdos.webserver:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pregdos*"]

[tool.setuptools.package-data]
# "static/*" does not descend into subdirectories, so static/img needs its own glob.
pregdos = [
    "templates/*.html",
    "static/*",
    "static/img/*",
    "data/*.csv",
    "data/spr_tables/*",
    "data/beam_models/*",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(message)s"

log_file = "pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_file_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 127

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.yapf]
based_on_style = "pep8"
column_limit = 127

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
write_to = "pregdos/__version__.py"
