# PregDos run retention.
#
# Install this drop-in so the server's studies root is tidied automatically:
#
#     sudo cp packaging/tmpfiles.d/pregdos.conf /etc/tmpfiles.d/pregdos.conf
#     sudo systemd-tmpfiles --clean        # apply once now; the daily timer does the rest
#
# Runs are transient: results must be downloaded off the server, and stale runs should not
# pile up.  This removes anything under the studies root that has not been touched for 30
# days.  `e` acts only on an *existing* directory and does NOT create it or change its
# owner/mode -- PregDos itself creates the root 0700 as the account running the server.
#
# The default studies root is /var/tmp/pregdos.  If you set PREGDOS_WORK_DIR to something
# else (e.g. /srv/pregdos), change the path below to match.
#
# Keep the age (30d) in sync with RUN_RETENTION_DAYS in pregdos/webserver.py, which drives
# the "runs are deleted after N days" notice shown in the web UI.
#
# Type Path             Mode UID GID Age
e     /var/tmp/pregdos  -    -   -   30d
